<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>启动中</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #09090b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }
      .box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      .bar {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: #27272a;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #e4e4e7;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/logo.png" alt="logo" />
      <div class="bar"></div>
    </div>
  </body>
</html>
