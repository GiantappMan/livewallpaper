[package]
name = "giantapp-wallpaper"
version = "4.0.0"
edition = "2021"
description = "Giantapp Wallpaper IV - Tauri client"
license = "LGPL-3.0"
default-run = "giantapp-wallpaper"

[lib]
name = "giantapp_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/wallpaper-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wallpaper-core = { path = "crates/wallpaper-core" }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
log = { version = "0.4", features = ["alloc"] }
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.8"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs", "process"] }
uuid = { version = "1", features = ["v4"] }
sevenz-rust2 = "0.22.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
