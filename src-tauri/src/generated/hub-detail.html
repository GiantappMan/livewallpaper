<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>巨应壁纸</title>
    <style>
      /* 详情弹窗外壳：本地页承载远程详情页 iframe。
         远程 origin 无权 invoke 应用命令（ACL），桥调用经 hub_compat.js
         中继到本页（本地 frame），再由本页接收器执行。 */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #141414;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        // 与 src-tauri/src/lib.rs HUB_ORIGINS 保持一致
        var ALLOWED_ORIGINS = [
          "https://wallpaper.giantapp.cn",
          "https://www.giantapp.cc",
          "https://livewallpaper.giantapp.cn",
          "http://localhost:3000",
          "http://localhost:3001",
        ];
        var raw = "";
        try {
          raw = decodeURIComponent(window.location.hash.replace(/^#/, ""));
        } catch (e) {}
        var url = null;
        try {
          url = new URL(raw);
        } catch (e) {}
        if (url && ALLOWED_ORIGINS.indexOf(url.origin) >= 0) {
          var iframe = document.createElement("iframe");
          iframe.allow = "fullscreen; autoplay";
          // 不做加载动画：iframe 直接挂载，远程页边下边渲染
          iframe.src = url.href;
          document.body.appendChild(iframe);
        }

        var closed = false;
        // 关闭弹窗。本页是本地上下文（不受 ACL 限制），直接 invoke 应用命令，
        // 与 hub_compat.js 方法表的 CloseWindow -> close_window 一致
        function closeSelf() {
          if (closed) return;
          closed = true;
          try {
            window.__TAURI_INTERNALS__.invoke("close_window");
          } catch (e) {
            window.close();
          }
        }

        // Esc 关窗：焦点在本页时直接收；焦点在远程 iframe 里时本页收不到
        // 键盘事件，由 hub_compat.js 捕获后经 __wpRelay:5 转发过来
        window.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeSelf();
        });

        // 远程页消息：标题（hub_compat 转发）→ 窗口标题；Esc → 关窗
        window.addEventListener("message", function (e) {
          if (!e.data) return;
          if (e.data.__wpRelay === 5 && e.data.key === "Escape") {
            closeSelf();
          } else if (e.data.__wpRelay === 4 && e.data.title) {
            document.title = e.data.title;
          }
        });
      })();
    </script>
  </body>
</html>
