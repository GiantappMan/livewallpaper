<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>巨应壁纸</title>
    <style>
      /* 详情弹窗外壳：本地页承载远程详情页 iframe。
         远程 origin 无权 invoke 应用命令（ACL），桥调用经 hub_compat.js
         中继到本页（本地 frame），再由本页接收器执行。 */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #141414;
      }
      /* 远程详情页装载期间的加载动画，iframe 就绪后移除 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141414;
      }
      #boot .ring {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div></div>
    <script>
      (function () {
        // 与 src-tauri/src/lib.rs HUB_ORIGINS 保持一致
        var ALLOWED_ORIGINS = [
          "https://wallpaper.giantapp.cn",
          "https://www.giantapp.cc",
          "https://livewallpaper.giantapp.cn",
          "http://localhost:3000",
          "http://localhost:3001",
        ];
        var raw = "";
        try {
          raw = decodeURIComponent(window.location.hash.replace(/^#/, ""));
        } catch (e) {}
        var url = null;
        try {
          url = new URL(raw);
        } catch (e) {}
        var boot = document.getElementById("boot");
        if (!url || ALLOWED_ORIGINS.indexOf(url.origin) < 0) {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
          return;
        }

        var iframe = document.createElement("iframe");
        iframe.allow = "fullscreen; autoplay";
        // 装载完成（或失败出现错误页）后撤掉动画；兜底 15s 强制移除防卡死
        iframe.addEventListener("load", function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        });
        setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, 15000);
        iframe.src = url.href;
        document.body.appendChild(iframe);

        // 远程页标题（hub_compat 转发）→ 窗口标题
        window.addEventListener("message", function (e) {
          if (e.data && e.data.__wpRelay === 4 && e.data.title) {
            document.title = e.data.title;
          }
        });
      })();
    </script>
  </body>
</html>
