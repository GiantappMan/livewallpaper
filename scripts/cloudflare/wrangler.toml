# 巨应壁纸更新分发 Worker（模板）。
# 不含任何账号 / 密钥信息：账号绑定来自本机 `wrangler login` 的 OAuth 登录态；
# 如需自定义名称，用环境变量 CF_WORKER_NAME / CF_R2_BUCKET（publish 脚本会
# 生成 wrangler.generated.toml，不入库）。
name = "giantapp-wallpaper-releases"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "giantapp-wallpaper-releases"
